<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
    }

    .thank-you-page {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
        url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
      background-size: cover;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .thank-you-content {
      max-width: 600px;
      animation: fadeIn 2s ease-out forwards;
    }

    .thank-you-content h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .thank-you-content p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .thank-you-content a {
      display: inline-block;
      padding: 12px 24px;
      color: #fff;
      background: #ff6f61;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .thank-you-content a:hover {
      background: #ff4b3e;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .thank-you-content h1 {
        font-size: 2.2rem;
      }

      .thank-you-content p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <section class="thank-you-page">
    <div class="thank-you-content">
      <h1>Thank You!</h1>
      <p>Your form has been successfully submitted. We appreciate your time and effort — we'll be in touch shortly.</p>
      <a href="file:///C:/Users/LENOVO/OneDrive/Desktop/web%20pages/index.html">Back to Home</a>
    </div>
  </section>

</body>
</html>
