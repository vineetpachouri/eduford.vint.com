<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us – Eduford University</title>
  <link rel="stylesheet" href="shourya.css" />
</head>
<body>
  <div class="contact-wrapper">
    <div class="overlay"></div>
    <div class="content">
      <header>
        <h1>Contact Us</h1>
        <p>We're here to assist you. Get in touch with us!</p>
      </header>

      <section class="contact-form">
        <form action="file:///C:/Users/LENOVO/OneDrive/Desktop/web%20pages/thank%20you.html" method="POST">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required />
          </div>
          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
          </div>
          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" placeholder="Write your message" rows="6" required></textarea>
          </div>
          <button type="submit" class="cta-dark">Submit</button>
        </form>
      </section>

      <footer>
        <p>&copy; 2025 Eduford University. All rights reserved.</p>
      </footer>
    </div>
  </div>
</body>
</html>
